<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso de hóspede</title>
    <link rel="shortcut icon" type="image/png" href="{{ url_for('dashboard', path='images/logos/favicon.png') }}" />
    <link rel="stylesheet" href="{{ url_for('dashboard', path='css/styles.min.css') }}" />
</head>

<body>
    {% if flash %}
    <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
            {% for category, message in flash %}
            <div class="toast align-items-center text-bg-{{ 'danger' if category=='error' else category }} border-0 mb-2"
                role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        {{ message }}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <div
            class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
            <div class="d-flex align-items-center justify-content-center w-100">
                <div class="row justify-content-center w-100">
                    <div class="col-md-4 col-lg-4 col-xxl-4">
                        <div class="card mb-0 shadow-lg">
                            <div class="card-body row justify-content-between">
                                <a href="{{ url_for('home') }}" class="text-center pb-3 w-100">
                                    <img src="{{ url_for('dashboard', path='images/logos/dark-logo.svg') }}" width="200"
                                        alt="">
                                </a>
                                <!-- LOGIN -->
                                <div id="login-card" class="col-12 col-lg-12 card shadow-lg p-4">
                                    <p class="text-center">Informe seu CPF para localizarmos sua reserva</p>
                                    <form id="login-form" action="{{ url_for('guest_access') }}" method="post"
                                        enctype="multipart/form-data">
                                        {% if csrf_token %}<input type="hidden" name="csrf_token"
                                            value="{{ csrf_token }}">{% endif %}
                                        <div class="mb-4">
                                            <label for="exampleInputtext1" class="form-label">CPF</label>
                                            <input type="text" class="form-control" name="cpf" maxlength="11" required>
                                        </div>
                                        <button type="submit"
                                            class="btn btn-primary w-100 py-8 fs-4 mb-2 rounded-2">Enviar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
