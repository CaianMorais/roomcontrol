<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso de colaborador</title>
    <link rel="shortcut icon" type="image/png" href="{{ url_for('dashboard', path='images/logos/favicon.png') }}" />
    <link rel="stylesheet" href="{{ url_for('dashboard', path='css/styles.min.css') }}" />
</head>

<body>
    {% if flash %}
    <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        {% for category, message in flash %}
        <div class="toast align-items-center text-bg-{{ 'danger' if category=='error' else category }} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
            <div class="toast-body">
                {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        {% endfor %}
        </div>
    </div>
    {% endif %}
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <div
            class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
            <div class="d-flex align-items-center justify-content-center w-100">
                <div class="row justify-content-center w-100">
                    <div class="col-md-4 col-lg-4 col-xxl-4">
                        <div class="card mb-0 shadow-lg">
                            <div class="card-body row justify-content-between">
                                <a href="{{ url_for('home') }}" class="text-center pb-3 w-100">
                                    <img src="{{ url_for('dashboard', path='images/logos/dark-logo.svg') }}" width="200" alt="">
                                </a>
                                <div id="login-card" class="col-12 col-lg-12 card shadow-lg p-4">
                                    <p class="text-center">Crie uma nova senha abaixo</p>
                                    <form id="login-form" action="{{ url_for('change_password') }}" method="POST" enctype="multipart/form-data">
                                        {% if csrf_token %}
                                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                                        {% endif %}
                                        <div class="mb-4">
                                            <label for="new_password" class="form-label">Nova senha</label>
                                            <input type="password" class="form-control" name="new_password" id="new_password" required placeholder="Digite o nome de usuário">
                                        </div>
                                        <div class="mb-4">
                                            <label for="confirm_password" class="form-label">Repetir nova senha</label>
                                            <input type="password" class="form-control" name="confirm_password" id="confirm_password" required placeholder="Digite o nome de usuário">
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100 py-8 fs-4 mb-2 rounded-2">Entrar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const toastEls = document.querySelectorAll('.toast');
        toastEls.forEach(el => new bootstrap.Toast(el, { delay: 4000 }).show());
        });
    </script>
</body>
</html>
