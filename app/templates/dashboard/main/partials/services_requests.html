<div class="col-12 col-xl-6">
    <div class="card shadow-lg border-0 h-100">
        <div class="card-header bg-white d-flex align-items-center justify-content-between">
            <div>
                <h2 class="h5 mb-0">Pedidos de serviço</h2>
                <small class="text-muted">Não concluídos (últimos 3 pedidos)</small>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="refresh-services-btn">
                Atualizar
            </button>
        </div>
        <div class="card-body">
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <div class="rounded border p-3">
                        <div class="text-muted small">Pendentes</div>
                        <div class="fs-4 fw-semibold" id="services-pending-count">--</div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="rounded border p-3">
                        <div class="text-muted small">Em andamento</div>
                        <div class="fs-4 fw-semibold" id="services-progress-count">--</div>
                    </div>
                </div>
            </div>

            <div id="services-loading" class="text-muted small">
                Carregando pedidos de serviço...
            </div>

            <div id="services-error" class="alert alert-danger py-2 px-3 d-none mb-3" role="alert">
                Não foi possível carregar os pedidos de serviço.
            </div>

            <div id="services-empty" class="text-muted small d-none">
                Não há pedidos de serviço pendentes ou em andamento.
            </div>

            <div class="list-group list-group-flush" id="services-list"></div>
        </div>
    </div>
</div>
