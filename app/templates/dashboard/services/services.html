{% extends "dashboard/partials/base.html" %}

{% block title %}Pedidos - {% if current_hotel %}{{ current_hotel.name }}{% endif %}{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.bootstrap5.min.css" />

<div class="container-fluid">
    <div class="row">

        <div class="col-lg-12 d-flex align-items-stretch">
            <div class="card w-100 shadow-lg">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center justify-content-between">
                        <h5 class="card-title fw-semibold mb-4">Pedidos de Serviços</h5>
                        <div>
                            <a class="btn btn-info mb-4" onclick="reloadTable()">Atualizar <i class="ti ti-refresh"></i></a>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table text-nowrap mb-0 align-middle" id="servicos">
                            <thead class="text-dark fs-4">
                                <tr>
                                    <th class="border-bottom-0">
                                        <h6 class="text-center fw-semibold mb-0">Nº Pedido</h6>
                                    </th>
                                    <th class="border-bottom-0">
                                        <h6 class="text-center fw-semibold mb-0">Nº Reserva</h6>
                                    </th>
                                    <th class="border-bottom-0">
                                        <h6 class="text-center fw-semibold mb-0">Nº Quarto</h6>
                                    </th>
                                    <th class="border-bottom-0">
                                        <h6 class="text-center fw-semibold mb-0">Hóspede</h6>
                                    </th>
                                    <th class="border-bottom-0">
                                        <h6 class="text-center fw-semibold mb-0">Status</h6>
                                    </th>
                                    <th class="border-bottom-0">
                                        <h6 class="text-center fw-semibold mb-0">Horário do pedido</h6>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.datatables.net/2.3.5/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const hotel_id = '{{ hotel_id }}';

    function carregaTabelaPedidos(){
        let table = $('#servicos').DataTable({
            destroy: true,
            responsive: true,
            language: {
                url: 'https://cdn.datatables.net/plug-ins/2.3.5/i18n/pt-BR.json',
            },
            order: [[
                5, 'desc'
            ]],
            ajax: {
                method: 'GET',
                url: `/api/table_services_requests?hotel_id=${hotel_id}`,
                dataSrc: function(json) {
                    if (json && json.length) return json;
                    return [];
                    },
                },
            columns: [
                {
                    data: 'id',
                    class: 'text-center',
                },
                {
                    data: 'reservation.id',
                    class: 'text-center'
                },
                {
                    data: 'reservation.room.room_number',
                    class: 'text-center'
                },
                {
                    data: 'reservation.guest.name',
                    class: 'text-center'
                },
                {
                    data: 'status_table',
                    class: 'text-center'
                },
                {
                    data: 'request_date_table',
                    class: 'text-center'
                },
                {
                    title: 'Ações',
                    data: 'id',
                    className: 'text-center',
                    class: 'text-center',
                    render: function (data, type, full, meta) {
                        return `<a href="dashboard_services/pedido/${data}">Ver pedido</a>`
                    }
                }
            ],
        });
    }
    carregaTabelaPedidos();

    // setInterval(function(){ 
    //     carregaTabelaPedidos();
    // }, 60000)

    function reloadTable(){
        carregaTabelaPedidos();
    }
    

    
</script>
{% endblock %}
