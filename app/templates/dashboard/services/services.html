{% extends "dashboard/partials/base.html" %}

{% block title %}Pedidos - {% if current_hotel %}{{ current_hotel.name }}{% endif %}{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.bootstrap5.min.css" />

<div class="container-fluid">
    <div class="row">

        <div class="col-lg-12 d-flex align-items-stretch">
            <div class="card w-100 shadow-lg">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h5 class="card-title fw-semibold mb-4">Pedidos de Serviços</h5>
                            <span>A tabela atualizará em <b id="count"></b> segundos</span>
                        </div>
                        <div>
                            <a class="btn btn-info mb-4" onclick="reloadTable()">Atualizar <i class="ti ti-refresh"></i></a>
                        </div>
                    </div>
                    <div class="table-responsive">
                        {% include 'dashboard/services/partials/_table.html' %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.datatables.net/2.3.5/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const hotel_id = '{{ request.session.get("hotel_id") }}';
</script>
<script src="{{ url_for('dashboard', path='js/services/table_requests.js') }}"></script>
{% endblock %}
