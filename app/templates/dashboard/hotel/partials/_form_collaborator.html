<h5 class="card-title fw-semibold mb-4">Dados do Hotel</h5>
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">

<div class="row">
    <div class="col-md-6">
        <div class="mb-3">
            <label for="name" class="form-label">Nome do Hotel</label>
            <input type="text" class="form-control bg-light" id="name" name="name" value="{{ hotel.name }}" readonly
                required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control bg-light" id="email" name="email" value="{{ hotel.email }}" readonly
                required>
        </div>
        <div class="mb-3">
            <label for="login" class="form-label">Login</label>
            <input type="text" class="form-control bg-light" id="login" name="login" value="{{ hotel.login }}" readonly
                required>
        </div>
        <div class="mb-3">
            <label for="phone_number" class="form-label">Telefone</label>
            <input type="text" class="form-control bg-light" id="phone_number" name="phone_number"
                value="{{ hotel.phone_number }}" readonly required>
        </div>
        <div class="mb-3">
            <label class="form-label">CNPJ (Não editável)</label>
            <input type="text" class="form-control bg-light" id="cnpj" value="{{ hotel.cnpj }}" readonly>
        </div>
    </div>
    <div class="col-md-6">
        <div class="mb-3">
            <label for="zip_code" class="form-label">CEP</label>
            <input type="text" class="form-control bg-light" id="zip_code" name="zip_code" value="{{ hotel.zip_code }}"
                maxlength="8" readonly required>
        </div>
        <div class="row">
            <div class="col-md-9">
                <div class="mb-3">
                    <label for="address" class="form-label">Endereço</label>
                    <input type="text" class="form-control bg-light" id="address" name="address"
                        value="{{ hotel.address.split(',')[0].strip() if ',' in hotel.address else hotel.address }}"
                        readonly required>
                </div>
            </div>
            <div class="col-md-3">
                <div class="mb-3">
                    <label for="number" class="form-label">Número</label>
                    <input type="text" class="form-control bg-light" id="number" name="number"
                        value="{{ hotel.address.split(',')[1].strip() if ',' in hotel.address else '' }}" readonly
                        required>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-8">
                <div class="mb-3">
                    <label for="city" class="form-label">Cidade</label>
                    <input type="text" class="form-control bg-light" id="city" name="city" value="{{ hotel.city }}"
                        readonly required>
                </div>
            </div>
            <div class="col-md-4">
                <div class="mb-3">
                    <label for="state" class="form-label">Estado (UF)</label>
                    <input type="text" class="form-control bg-light" id="state" name="state" value="{{ hotel.state }}"
                        maxlength="2" readonly required>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-4">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-danger ms-2">Voltar ao dashboard</a>
    </div>
</div>
