
<table class="table text-nowrap mb-0 align-middle">
    <thead class="text-dark fs-4">
    <tr>
        <th class="border-bottom-0">
            <h6 class="fw-semibold mb-0">ID</h6>
        </th>
        <th class="border-bottom-0">
            <h6 class="fw-semibold mb-0">Nome</h6>
        </th>
        <th class="border-bottom-0">
            <h6 class="fw-semibold mb-0">CPF</h6>
        </th>
        <th class="border-bottom-0">
            <h6 class="fw-semibold mb-0">Ativo</h6>
        </th>
        <th class="border-bottom-0">
            <h6 class="fw-semibold mb-0">Ações</h6>
        </th>
    </tr>
    </thead>
    <tbody>
    {% for collaborator in collaborators %}
        <tr class="align-items-center">
            <td class="border-bottom-0">
                <p class="fw-semibold mb-0">{{ collaborator.id }}</p>
            </td>
            <td class="border-bottom-0">
                <p class="fw-semibold mb-0">{{ collaborator.firstname + " " + collaborator.lastname }}</p>
            </td>
            <td class="border-bottom-0">
                <p class="fw-semibold mb-0">{{ collaborator.cpf[:3] + "." + collaborator.cpf[3:6]
                                            + "." +
                                            collaborator.cpf[6:9] + "." + collaborator.cpf[9:] }}</p>
                {# <span class="fw-normal">Web Designer</span> #}
            </td>
            <td class="border-bottom-0">
                <div class="d-flex align-items-center gap-2">
                                            <span class="badge bg-light rounded-5 fw-bold"><i
                                                    class="ti fs-6 {{ 'ti-check text-success' if collaborator.is_active else 'ti-x text-danger' }}"></i></span>
                </div>
            </td>
            <td class="border-bottom-0">
                <div class="d-flex align-items-center justify-content-start gap-3 fs-6">
                    <a href="{{ url_for('edit_collaborator', collaborator_id=collaborator.id) }}"
                       class="text-primary"><i class="ti ti-pencil"></i></a>
                    <a href="javascript:void(0)" class="btn-delete-collaborator text-danger"
                       data-id="{{ collaborator.id }}" data-name="{{ collaborator.firstname }}">
                        <i class="ti ti-trash"></i>
                    </a>
                </div>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
